[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # Marvin timing attack on RSA PKCS#1 v1.5 decryption; no fixed rsa release yet.
  # The proxy decrypts one client Encryption Response per session with a fresh
  # per-session key, over loopback, so an attacker gets no decryption oracle to
  # query repeatedly. Revisit when rsa 0.10 is stable.
  { id = "RUSTSEC-2023-0071", reason = "per-session ephemeral key, single decryption, loopback only" },
  # proc-macro-error is unmaintained; pulled in at build time only by gtk-rs 0.18
  # through Tauri's Linux webview stack. Goes away when Tauri moves to gtk4-rs.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc macro from Tauri's gtk 0.18 dependency" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-DFS-2016",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
