name: Fuzz
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Build every discovered target
        working-directory: fuzz
        run: |
          cargo +nightly fuzz list > targets.txt
          test -s targets.txt
          while read -r target; do cargo +nightly fuzz build "$target"; done < targets.txt
      - name: Run every target for 60 seconds
        working-directory: fuzz
        run: |
          failed=0
          while read -r target; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=512 -timeout=1 || failed=1
          done < targets.txt
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
