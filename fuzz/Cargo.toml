[package]
name = "mineburp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
bytes = "1.10.1"
libfuzzer-sys = "0.4"
mineburp-core = { path = "../crates/mineburp-core" }
mineburp-protocol = { path = "../crates/mineburp-protocol" }
serde_json = "1.0.142"

# Kept out of the main workspace: fuzzing needs nightly and cargo-fuzz.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbt"
path = "fuzz_targets/nbt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_edits"
path = "fuzz_targets/apply_edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema"
path = "fuzz_targets/schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identify"
path = "fuzz_targets/identify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_roundtrip"
path = "fuzz_targets/layout_roundtrip.rs"
test = false
doc = false
bench = false
