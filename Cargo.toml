[workspace]
resolver = "2"
members = [
  "crates/mineburp-core",
  "crates/mineburp-protocol",
  "crates/mineburp-project",
  "crates/mineburp-proxy",
  "crates/mineburp-auth",
  "crates/mineburp-session",
  "crates/mineburp-launcher",
  "crates/mineburp-capture",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mineburp/mineburp"

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = { version = "1.10.1", features = ["serde"] }
cipher = "0.4.4"
flate2 = "1.1.2"
hex = "0.4.3"
http = "1.3.1"
indexmap = { version = "2.10.0", features = ["serde"] }
parking_lot = "0.12.4"
rand = "0.9.2"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9.8"
rusqlite = { version = "0.40.1", features = [
  "bundled-sqlcipher-vendored-openssl",
  "functions",
  "uuid",
  "serde_json",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "serde", "macros"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.1", features = ["derive"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
